apiVersion: v1
kind: Namespace
metadata:
  name: harbor
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: goharbor
  namespace: harbor
spec:
  interval: 1h
  url: https://helm.goharbor.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: harbor
  namespace: harbor
spec:
  interval: 1h
  timeout: 10m
  chart:
    spec:
      chart: harbor
      version: "1.19.2"
      sourceRef:
        kind: HelmRepository
        name: goharbor
        namespace: harbor
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    expose:
      type: ingress
      tls:
        enabled: true
        certSource: secret
        secret:
          secretName: colt-chalko-wildcard-tls
      ingress:
        hosts:
          core: harbor.colt.chalko.com
        className: nginx
        annotations:
          ingress.kubernetes.io/ssl-redirect: "false"
          nginx.ingress.kubernetes.io/proxy-body-size: "0"
    externalURL: https://harbor.colt.chalko.com
    persistence:
      enabled: true
      resourcePolicy: keep
      persistentVolumeClaim:
        registry:
          size: 25Gi
          storageClass: local-path
        jobservice:
          jobLog:
            size: 2Gi
            storageClass: local-path
        database:
          size: 5Gi
          storageClass: local-path
        redis:
          size: 2Gi
          storageClass: local-path
    trivy:
      enabled: false
    portal:
      nodeSelector:
        kubernetes.io/arch: amd64
    core:
      nodeSelector:
        kubernetes.io/arch: amd64
    jobservice:
      nodeSelector:
        kubernetes.io/arch: amd64
    registry:
      nodeSelector:
        kubernetes.io/arch: amd64
    database:
      internal:
        nodeSelector:
          kubernetes.io/arch: amd64
    redis:
      internal:
        nodeSelector:
          kubernetes.io/arch: amd64
