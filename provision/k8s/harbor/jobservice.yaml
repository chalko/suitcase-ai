apiVersion: apps/v1
kind: Deployment
metadata:
  name: harbor-jobservice
  namespace: harbor
  labels:
    app.kubernetes.io/name: harbor
    app.kubernetes.io/component: jobservice
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: harbor
      app.kubernetes.io/component: jobservice
  template:
    metadata:
      labels:
        app.kubernetes.io/name: harbor
        app.kubernetes.io/component: jobservice
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: jobservice
          image: goharbor/harbor-jobservice:v2.11.0
          imagePullPolicy: IfNotPresent
          env:
            - name: CORE_SECRET
              valueFrom:
                secretKeyRef:
                  name: harbor-secret
                  key: CORE_SECRET
            - name: JOBSERVICE_SECRET
              valueFrom:
                secretKeyRef:
                  name: harbor-secret
                  key: JOBSERVICE_SECRET
            - name: REGISTRY_CONTROLLER_URL
              value: "http://harbor-registryctl:8080"
            - name: CORE_URL
              value: "http://harbor-core:8080"
            - name: TOKEN_SERVICE_URL
              value: "http://harbor-core:8080/service/token"
            - name: LOG_LEVEL
              value: "INFO"
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: jobservice-config
              mountPath: /etc/jobservice/config.yml
              subPath: config.yml
            - name: jobservice-logs
              mountPath: /var/log/jobs
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/v1/stats
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/v1/stats
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
      volumes:
        - name: jobservice-config
          configMap:
            name: harbor-jobservice-config
        - name: jobservice-logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: harbor-jobservice
  namespace: harbor
  labels:
    app.kubernetes.io/name: harbor
    app.kubernetes.io/component: jobservice
spec:
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  selector:
    app.kubernetes.io/name: harbor
    app.kubernetes.io/component: jobservice
