apiVersion: apps/v1
kind: Deployment
metadata:
  name: harbor-registry
  namespace: harbor
  labels:
    app.kubernetes.io/name: harbor
    app.kubernetes.io/component: registry
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: harbor
      app.kubernetes.io/component: registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: harbor
        app.kubernetes.io/component: registry
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: registry
          image: goharbor/registry-photon:v2.11.0
          imagePullPolicy: IfNotPresent
          env:
            - name: REGISTRY_HTTP_SECRET
              valueFrom:
                secretKeyRef:
                  name: harbor-secret
                  key: REGISTRY_HTTP_SECRET
          ports:
            - name: http
              containerPort: 5000
            - name: metrics
              containerPort: 5001
          volumeMounts:
            - name: registry-data
              mountPath: /storage
            - name: registry-config
              mountPath: /etc/registry/config.yml
              subPath: config.yml
            - name: token-root-cert
              mountPath: /etc/registry/root.crt
              subPath: root.crt
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
        - name: registryctl
          image: goharbor/harbor-registryctl:v2.11.0
          imagePullPolicy: IfNotPresent
          env:
            - name: CORE_SECRET
              valueFrom:
                secretKeyRef:
                  name: harbor-secret
                  key: CORE_SECRET
            - name: JOBSERVICE_SECRET
              valueFrom:
                secretKeyRef:
                  name: harbor-secret
                  key: JOBSERVICE_SECRET
            - name: CORE_URL
              value: "http://harbor-core:8080"
          ports:
            - name: registryctl
              containerPort: 8080
          volumeMounts:
            - name: registry-data
              mountPath: /storage
            - name: registry-config
              mountPath: /etc/registry/config.yml
              subPath: config.yml
            - name: registryctl-config
              mountPath: /etc/registryctl/config.yml
              subPath: config.yml
            - name: token-root-cert
              mountPath: /etc/registry/root.crt
              subPath: root.crt
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
      volumes:
        - name: registry-data
          persistentVolumeClaim:
            claimName: harbor-registry-pvc
        - name: registry-config
          configMap:
            name: harbor-registry-config
        - name: registryctl-config
          configMap:
            name: harbor-registryctl-config
        - name: token-root-cert
          secret:
            secretName: harbor-secret
            items:
              - key: root.crt
                path: root.crt
---
apiVersion: v1
kind: Service
metadata:
  name: harbor-registry
  namespace: harbor
  labels:
    app.kubernetes.io/name: harbor
    app.kubernetes.io/component: registry
spec:
  ports:
    - name: http
      port: 5000
      targetPort: 5000
    - name: metrics
      port: 5001
      targetPort: 5001
  selector:
    app.kubernetes.io/name: harbor
    app.kubernetes.io/component: registry
---
apiVersion: v1
kind: Service
metadata:
  name: harbor-registryctl
  namespace: harbor
  labels:
    app.kubernetes.io/name: harbor
    app.kubernetes.io/component: registryctl
spec:
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  selector:
    app.kubernetes.io/name: harbor
    app.kubernetes.io/component: registry
