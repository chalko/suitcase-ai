apiVersion: v1
kind: ConfigMap
metadata:
  name: harbor-registry-config
  namespace: harbor
  labels:
    app.kubernetes.io/name: harbor
    app.kubernetes.io/component: registry
data:
  config.yml: |
    version: 0.1
    log:
      level: info
      fields:
        service: registry
    storage:
      cache:
        layerinfo: redis
      filesystem:
        rootdirectory: /storage
      delete:
        enabled: true
      redirect:
        disable: true
    http:
      addr: :5000
      secret: "harbor-http-secret-placeholder"
      debug:
        addr: :5001
        prometheus:
          enabled: true
          path: /metrics
    auth:
      token:
        issuer: harbor-token-issuer
        realm: https://harbor.colt.chalko.com/service/token
        rootcertbundle: /etc/registry/root.crt
        service: harbor-registry
    redis:
      addr: harbor-redis:6379
      db: 1
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: harbor-registryctl-config
  namespace: harbor
  labels:
    app.kubernetes.io/name: harbor
    app.kubernetes.io/component: registryctl
data:
  config.yml: |
    version: 0.1
    protocol: http
    port: 8080
    log:
      level: info
    registry_config: /etc/registry/config.yml
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: harbor-core-config
  namespace: harbor
  labels:
    app.kubernetes.io/name: harbor
    app.kubernetes.io/component: core
data:
  app.conf: |
    appname = harbor
    runmode = prod
    enablegzip = true

    [prod]
    httpport = 8080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: harbor-jobservice-config
  namespace: harbor
  labels:
    app.kubernetes.io/name: harbor
    app.kubernetes.io/component: jobservice
data:
  config.yml: |
    protocol: "http"
    port: 8080
    worker_pool:
      workers: 10
      backend: "redis"
      redis_pool:
        redis_url: "redis://harbor-redis:6379/2"
        namespace: "harbor_job_service_namespace"
    job_loggers:
      - name: "FILE"
        level: "INFO"
        settings:
          base_dir: "/var/log/jobs"
      - name: "STD_OUTPUT"
        level: "INFO"
    loggers:
      - name: "STD_OUTPUT"
        level: "INFO"
    core_url: "http://harbor-core:8080"
    token_service_url: "http://harbor-core:8080/service/token"
    reaper:
      max_update_hours: 24
      max_dangling_hours: 2
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: harbor-portal-config
  namespace: harbor
  labels:
    app.kubernetes.io/name: harbor
    app.kubernetes.io/component: portal
data:
  nginx.conf: |
    worker_processes auto;
    pid /tmp/nginx.pid;

    events {
        worker_connections 1024;
    }

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        client_body_temp_path /tmp/client_body;
        proxy_temp_path /tmp/proxy;
        fastcgi_temp_path /tmp/fastcgi;
        uwsgi_temp_path /tmp/uwsgi;
        scgi_temp_path /tmp/scgi;

        sendfile on;
        keepalive_timeout 65;
        client_max_body_size 0;

        upstream core {
            server harbor-core:8080;
        }

        server {
            listen 8080;
            server_name harbor.colt.chalko.com localhost;

            location / {
                root /usr/share/nginx/html;
                index index.html index.htm;
                try_files $uri $uri/ /index.html;
            }

            location /api/ {
                proxy_pass http://core/api/;
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_buffering off;
                proxy_request_buffering off;
            }

            location /service/ {
                proxy_pass http://core/service/;
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_buffering off;
                proxy_request_buffering off;
            }

            location /v2/ {
                proxy_pass http://core/v2/;
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_buffering off;
                proxy_request_buffering off;
            }

            location /c/ {
                proxy_pass http://core/c/;
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_buffering off;
                proxy_request_buffering off;
            }
        }
    }
