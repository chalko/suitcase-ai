apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: harbor

resources:
  - release.yaml
  - backup.yaml
  - secrets.yaml
  - setup-proxy-cache.yaml

configMapGenerator:
  - name: harbor-setup-proxy-cache-script
    files:
      - setup-proxy-cache.sh=scripts/setup-proxy-cache.sh

generatorOptions:
  disableNameSuffixHash: true
