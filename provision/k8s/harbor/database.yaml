apiVersion: apps/v1
kind: Deployment
metadata:
  name: harbor-database
  namespace: harbor
  labels:
    app.kubernetes.io/name: harbor
    app.kubernetes.io/component: database
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: harbor
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: harbor
        app.kubernetes.io/component: database
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        fsGroup: 999
      initContainers:
        - name: init-permissions
          image: goharbor/harbor-db:v2.11.0
          command: ["/bin/sh", "-c", "chown -R 999:999 /var/lib/postgresql/data && chmod 700 /var/lib/postgresql/data"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: database-data
              mountPath: /var/lib/postgresql/data
              subPath: database
      containers:
        - name: database
          image: goharbor/harbor-db:v2.11.0
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              value: registry
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRESQL_DATABASE
              value: registry
            - name: POSTGRESQL_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: harbor-secret
                  key: POSTGRESQL_PASSWORD
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: harbor-secret
                  key: POSTGRESQL_PASSWORD
            - name: POSTGRESQL_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: harbor-secret
                  key: POSTGRESQL_PASSWORD
          ports:
            - name: postgres
              containerPort: 5432
          volumeMounts:
            - name: database-data
              mountPath: /var/lib/postgresql/data
              subPath: database
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "pg_isready -U postgres -d registry"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "pg_isready -U postgres -d registry"]
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
      volumes:
        - name: database-data
          persistentVolumeClaim:
            claimName: harbor-database-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: harbor-database
  namespace: harbor
  labels:
    app.kubernetes.io/name: harbor
    app.kubernetes.io/component: database
spec:
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
  selector:
    app.kubernetes.io/name: harbor
    app.kubernetes.io/component: database
