apiVersion: batch/v1
kind: Job
metadata:
  name: harbor-setup-proxy-cache
  namespace: harbor
  labels:
    app.kubernetes.io/name: harbor-setup-proxy-cache
    app.kubernetes.io/part-of: camp-colt
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: harbor-setup-proxy-cache
        app.kubernetes.io/part-of: camp-colt
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: script-vol
          configMap:
            name: harbor-setup-proxy-cache-script
            defaultMode: 0755
      containers:
        - name: setup-proxy-cache
          image: curlimages/curl:latest
          command:
            - /bin/sh
            - /scripts/setup-proxy-cache.sh
          env:
            - name: HARBOR_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: harbor-secret
                  key: HARBOR_ADMIN_PASSWORD
            - name: NGC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ngc-secret
                  key: NGC_API_KEY
          volumeMounts:
            - name: script-vol
              mountPath: /scripts
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
