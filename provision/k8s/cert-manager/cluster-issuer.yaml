apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: nick@chalko.com
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - dns01:
          cloudDNS:
            project: colt-chalko
            serviceAccountSecretRef:
              name: clouddns-dns01-solver-secret
              namespace: cert-manager
              key: service-account.json
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-production
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: nick@chalko.com
    privateKeySecretRef:
      name: letsencrypt-production-account-key
    solvers:
      - dns01:
          cloudDNS:
            project: colt-chalko
            serviceAccountSecretRef:
              name: clouddns-dns01-solver-secret
              namespace: cert-manager
              key: service-account.json
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: colt-chalko-wildcard-tls
  namespace: ingress-nginx
spec:
  secretName: colt-chalko-wildcard-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  commonName: "*.colt.chalko.com"
  dnsNames:
    - "colt.chalko.com"
    - "*.colt.chalko.com"
