apiVersion: v1
kind: Namespace
metadata:
  name: kopiur-system
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: kopiur
  namespace: kopiur-system
spec:
  interval: 1h
  type: oci
  url: oci://ghcr.io/home-operations/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kopiur
  namespace: kopiur-system
spec:
  interval: 1h
  chart:
    spec:
      chart: kopiur
      version: "0.10.3"
      sourceRef:
        kind: HelmRepository
        name: kopiur
        namespace: kopiur-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    installScope: cluster
    features:
      credentialProjection:
        enabled: true
    nodeSelector:
      kubernetes.io/arch: amd64
