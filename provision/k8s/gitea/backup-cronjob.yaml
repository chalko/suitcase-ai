apiVersion: batch/v1
kind: CronJob
metadata:
  name: gitea-backup
  namespace: gitea
  labels:
    app.kubernetes.io/name: gitea-backup
    app.kubernetes.io/part-of: gitea
spec:
  schedule: "0 3 * * *" # Daily at 03:00 UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: gitea-backup
        spec:
          restartPolicy: OnFailure
          nodeSelector:
            kubernetes.io/arch: amd64
          securityContext:
            fsGroup: 1000
          initContainers:
            - name: gitea-dump
              image: gitea/gitea:1.22.6
              imagePullPolicy: IfNotPresent
              securityContext:
                runAsUser: 1000
                runAsGroup: 1000
                readOnlyRootFilesystem: false
              command:
                - /bin/sh
                - -c
                - |
                  set -euo pipefail
                  echo "[+] Starting Gitea atomic snapshot..."
                  DATE_TAG=$(date +%Y%m%d_%H%M%S)
                  /usr/local/bin/gitea dump \
                    -c /data/gitea/conf/app.ini \
                    --tempdir /scratch \
                    --file /backup/gitea-dump-${DATE_TAG}.zip
                  
                  echo "[+] Computing SHA256 checksum..."
                  cd /backup
                  sha256sum gitea-dump-${DATE_TAG}.zip > gitea-dump-${DATE_TAG}.zip.sha256
                  
                  echo "[✓] Archive created successfully: /backup/gitea-dump-${DATE_TAG}.zip"
                  ls -lh /backup/
              volumeMounts:
                - name: gitea-data
                  mountPath: /data
                  readOnly: true
                - name: backup-scratch
                  mountPath: /backup
                  subPath: backup
                - name: backup-scratch
                  mountPath: /scratch
                  subPath: scratch
          containers:
            - name: rclone-gdrive-sync
              image: rclone/rclone:1.68.2
              imagePullPolicy: IfNotPresent
              securityContext:
                runAsUser: 1000
                runAsGroup: 1000
              command:
                - /bin/sh
                - /scripts/sync-gdrive.sh
              volumeMounts:
                - name: backup-scratch
                  mountPath: /backup
                  subPath: backup
                - name: backup-scripts
                  mountPath: /scripts
                - name: gdrive-secret
                  mountPath: /etc/gdrive
                  readOnly: true
          volumes:
            - name: gitea-data
              persistentVolumeClaim:
                claimName: gitea-data
                readOnly: true
            - name: backup-scratch
              emptyDir: {}
            - name: backup-scripts
              configMap:
                name: gitea-backup-scripts
                defaultMode: 0755
            - name: gdrive-secret
              secret:
                secretName: gitea-gdrive-backup-secret
                optional: false
