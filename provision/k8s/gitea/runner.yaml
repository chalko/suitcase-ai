apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea-runner
  namespace: gitea
  labels:
    app.kubernetes.io/name: gitea-runner
    app.kubernetes.io/part-of: colt-gitea
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitea-runner
  template:
    metadata:
      labels:
        app: gitea-runner
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      volumes:
        - name: runner-config
          configMap:
            name: gitea-runner-config
        - name: runner-data
          emptyDir: {}
        - name: dind-storage
          emptyDir: {}
      containers:
        - name: dind
          image: docker:27.5.1-dind
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          volumeMounts:
            - name: dind-storage
              mountPath: /var/lib/docker
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "4Gi"
        - name: runner
          image: gitea/act_runner:0.2.12
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for Docker daemon to become available..."
              while ! nc -z localhost 2375 </dev/null; do
                sleep 1
              done
              echo "Docker daemon ready."
              cd /data
              if [ ! -s /data/.runner ]; then
                echo "Registering runner with Gitea..."
                act_runner register --no-interactive \
                  --instance "${GITEA_INSTANCE_URL}" \
                  --token "${GITEA_RUNNER_REGISTRATION_TOKEN}" \
                  --name "${GITEA_RUNNER_NAME}" \
                  --labels "ubuntu-latest:docker://catthehacker/ubuntu:act-22.04,ubuntu-22.04:docker://catthehacker/ubuntu:act-22.04" \
                  --config /config/config.yaml
              fi
              echo "Starting act_runner daemon..."
              exec act_runner daemon --config /config/config.yaml
          env:
            - name: GITEA_INSTANCE_URL
              value: "http://gitea.gitea.svc.cluster.local:3000"
            - name: GITEA_RUNNER_REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gitea-runner-secret
                  key: token
            - name: GITEA_RUNNER_NAME
              value: "colt-k8s-runner-01"
            - name: DOCKER_HOST
              value: "tcp://localhost:2375"
            - name: CONFIG_FILE
              value: "/config/config.yaml"
          volumeMounts:
            - name: runner-config
              mountPath: /config
            - name: runner-data
              mountPath: /data
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
