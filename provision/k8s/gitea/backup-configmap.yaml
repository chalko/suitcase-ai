apiVersion: v1
kind: ConfigMap
metadata:
  name: gitea-backup-scripts
  namespace: gitea
data:
  sync-gdrive.sh: |
    #!/bin/sh
    set -euo pipefail

    echo "=== Camp Colt Gitea Google Drive Backup & Retention Sync ==="

    if [ ! -f /etc/gdrive/sa.json ]; then
      echo "[-] ERROR: Google Drive Service Account key not found at /etc/gdrive/sa.json"
      exit 1
    fi

    # 1. Dynamically configure rclone
    export RCLONE_CONFIG_GDRIVE_TYPE="drive"
    export RCLONE_CONFIG_GDRIVE_SCOPE="drive"
    export RCLONE_CONFIG_GDRIVE_SERVICE_ACCOUNT_FILE="/etc/gdrive/sa.json"
    
    # Optional folder ID if specified, else root-relative path
    if [ -n "${GDRIVE_ROOT_FOLDER_ID:-}" ]; then
      export RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID="${GDRIVE_ROOT_FOLDER_ID}"
    fi

    REMOTE_BASE="gdrive:Backups/CampColt/Gitea"
    DUMP_FILE=$(ls -t /backup/gitea-dump-*.zip | head -n1)
    SHA_FILE="${DUMP_FILE}.sha256"

    if [ -z "${DUMP_FILE}" ] || [ ! -f "${DUMP_FILE}" ]; then
      echo "[-] ERROR: No backup archive found in /backup"
      exit 1
    fi

    echo "[+] Uploading latest dump: $(basename "${DUMP_FILE}")"

    # 2. Upload to Daily tier
    echo "[+] Syncing to ${REMOTE_BASE}/daily/..."
    rclone copy "${DUMP_FILE}" "${REMOTE_BASE}/daily/"
    rclone copy "${SHA_FILE}" "${REMOTE_BASE}/daily/"

    # 3. GFS Tiering logic
    DAY_OF_WEEK=$(date +%u)   # 1=Mon, 7=Sun
    DAY_OF_MONTH=$(date +%d)  # 01-31
    DAY_OF_YEAR=$(date +%j)   # 001-366

    if [ "${DAY_OF_WEEK}" = "7" ]; then
      echo "[+] Sunday detected — syncing weekly snapshot to ${REMOTE_BASE}/weekly/..."
      rclone copy "${DUMP_FILE}" "${REMOTE_BASE}/weekly/"
      rclone copy "${SHA_FILE}" "${REMOTE_BASE}/weekly/"
    fi

    if [ "${DAY_OF_MONTH}" = "01" ]; then
      echo "[+] First of month detected — syncing monthly snapshot to ${REMOTE_BASE}/monthly/..."
      rclone copy "${DUMP_FILE}" "${REMOTE_BASE}/monthly/"
      rclone copy "${SHA_FILE}" "${REMOTE_BASE}/monthly/"
    fi

    if [ "${DAY_OF_YEAR}" = "001" ] || [ "${DAY_OF_YEAR}" = "1" ]; then
      echo "[+] First of year detected — archiving permanent yearly snapshot to ${REMOTE_BASE}/yearly/..."
      rclone copy "${DUMP_FILE}" "${REMOTE_BASE}/yearly/"
      rclone copy "${SHA_FILE}" "${REMOTE_BASE}/yearly/"
    fi

    # 4. Enforce Retention Policy
    echo "[+] Applying retention pruning on Google Drive..."
    echo "    • Daily retention: 14 days"
    rclone delete --min-age 14d "${REMOTE_BASE}/daily/" || true

    echo "    • Weekly retention: 6 weeks (42 days)"
    rclone delete --min-age 42d "${REMOTE_BASE}/weekly/" || true

    echo "    • Monthly retention: 13 months (395 days)"
    rclone delete --min-age 395d "${REMOTE_BASE}/monthly/" || true

    echo "    • Yearly archives: Preserved permanently (no deletion)"

    echo "[✓] Google Drive backup and retention sync completed successfully."
