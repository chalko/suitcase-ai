apiVersion: batch/v1
kind: CronJob
metadata:
  name: colt-backup-vault
  namespace: backup-system
  labels:
    app.kubernetes.io/name: colt-backup-vault
    app.kubernetes.io/part-of: camp-colt
spec:
  schedule: "0 2 * * *" # Daily at 02:00 UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: colt-backup-vault
        spec:
          serviceAccountName: colt-backup-sa
          restartPolicy: OnFailure
          nodeSelector:
            kubernetes.io/arch: amd64
          containers:
            - name: kopia-runner
              image: kopia/kopia:0.18.2
              imagePullPolicy: IfNotPresent
              securityContext:
                runAsUser: 1000
                runAsGroup: 1000
              env:
                - name: APP_NAME
                  value: "vault"
                - name: BACKUP_TYPE
                  value: "vault"
                - name: KOPIA_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: colt-kopia-backup-secret
                      key: KOPIA_PASSWORD
                - name: GDRIVE_FOLDER_ID
                  valueFrom:
                    secretKeyRef:
                      name: colt-kopia-backup-secret
                      key: GDRIVE_FOLDER_ID
              command:
                - /bin/sh
                - /scripts/kopia-backup-runner.sh
              volumeMounts:
                - name: backup-scripts
                  mountPath: /scripts
                - name: gdrive-secret
                  mountPath: /etc/gdrive
                  readOnly: true
                - name: scratch-space
                  mountPath: /scratch
          volumes:
            - name: backup-scripts
              configMap:
                name: colt-backup-scripts
                defaultMode: 0755
            - name: gdrive-secret
              secret:
                secretName: colt-kopia-backup-secret
                optional: false
            - name: scratch-space
              emptyDir: {}
---
