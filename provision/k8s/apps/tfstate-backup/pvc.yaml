apiVersion: v1
kind: PersistentVolume
metadata:
  name: colt-tfstate-nfs-pv
  labels:
    app.kubernetes.io/name: tfstate-backup
    app.kubernetes.io/part-of: camp-colt
spec:
  capacity:
    storage: 50Gi
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: 10.82.0.2
    path: /local-fast-zfs/colt/backups/tfstate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: colt-tfstate-nfs-pvc
  namespace: vault-backup
  labels:
    app.kubernetes.io/name: tfstate-backup
    app.kubernetes.io/part-of: camp-colt
spec:
  accessModes:
    - ReadOnlyMany
  storageClassName: ""
  resources:
    requests:
      storage: 50Gi
  volumeName: colt-tfstate-nfs-pv
