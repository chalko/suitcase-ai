apiVersion: batch/v1
kind: CronJob
metadata:
  name: tfstate-gdrive-backup
  namespace: vault-backup
  labels:
    app.kubernetes.io/name: tfstate-backup
    app.kubernetes.io/part-of: camp-colt
spec:
  schedule: "30 2 * * *" # Daily at 02:30 UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: tfstate-backup
        spec:
          restartPolicy: OnFailure
          nodeSelector:
            kubernetes.io/arch: amd64
          containers:
            - name: rclone-gdrive-sync
              image: rclone/rclone:1.68.2
              imagePullPolicy: IfNotPresent
              securityContext:
                runAsUser: 1000
                runAsGroup: 1000
              command:
                - /bin/sh
                - /scripts/sync-gdrive.sh
              volumeMounts:
                - name: tfstate-backup-nfs
                  mountPath: /backup
                  readOnly: true
                - name: backup-scripts
                  mountPath: /scripts
                - name: gdrive-secret
                  mountPath: /etc/gdrive
                  readOnly: true
          volumes:
            - name: tfstate-backup-nfs
              persistentVolumeClaim:
                claimName: colt-tfstate-nfs-pvc
                readOnly: true
            - name: backup-scripts
              configMap:
                name: tfstate-backup-scripts
                defaultMode: 0755
            - name: gdrive-secret
              secret:
                secretName: vault-gdrive-backup-secret
                optional: false
