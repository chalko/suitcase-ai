apiVersion: apps/v1
kind: Deployment
metadata:
  name: olah
  namespace: model-cache
  labels:
    app: olah
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: olah
  template:
    metadata:
      labels:
        app: olah
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: olah
          image: harbor.colt.chalko.com/colt/olah:v0.1.18
          imagePullPolicy: IfNotPresent
          args:
            - --repos-path
            - /data/cache
            - --cache-size-limit
            - 15GB
            - --cache-clean-strategy
            - LRU
            - --port
            - "8090"
            - --host
            - 0.0.0.0
            - --mirror-scheme
            - https
            - --mirror-netloc
            - olah.colt.chalko.com
          ports:
            - containerPort: 8090
              name: http
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: GIT_PYTHON_REFRESH
              value: "quiet"
          volumeMounts:
            - name: cache-storage
              mountPath: /data/cache
            - name: config-volume
              mountPath: /etc/olah
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          startupProbe:
            httpGet:
              path: /openapi.json
              port: 8090
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /openapi.json
              port: 8090
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /openapi.json
              port: 8090
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
      volumes:
        - name: cache-storage
          persistentVolumeClaim:
            claimName: olah-cache-pvc
        - name: config-volume
          configMap:
            name: olah-config
