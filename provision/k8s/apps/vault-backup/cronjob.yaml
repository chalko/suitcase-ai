apiVersion: batch/v1
kind: CronJob
metadata:
  name: vault-backup
  namespace: vault-backup
  labels:
    app.kubernetes.io/name: vault-backup
    app.kubernetes.io/part-of: camp-colt
spec:
  schedule: "0 2 * * *" # Daily at 02:00 UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: vault-backup
        spec:
          serviceAccountName: vault-backup-sa
          restartPolicy: OnFailure
          nodeSelector:
            kubernetes.io/arch: amd64
          initContainers:
            - name: vault-snapshot
              image: hashicorp/vault:1.18.4
              imagePullPolicy: IfNotPresent
              securityContext:
                runAsUser: 1000
                runAsGroup: 1000
              command:
                - /bin/sh
                - -c
                - |
                  set -euo pipefail
                  echo "[+] Authenticating to HashiCorp Vault via Kubernetes Auth..."
                  export VAULT_ADDR="https://10.82.0.5:8200"
                  export VAULT_SKIP_VERIFY="true"
                  
                  K8S_JWT=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
                  VAULT_TOKEN=$(vault write -field=token auth/kubernetes/login role=vault-backup jwt="${K8S_JWT}")
                  export VAULT_TOKEN
                  
                  echo "[+] Successfully acquired Vault client token."

                  DATE_TAG=$(date +%Y%m%d_%H%M%S)
                  SNAP_NAME="vault-raft-${DATE_TAG}.snap"
                  
                  echo "[+] Taking live atomic Raft snapshot to /backup/${SNAP_NAME}..."
                  vault operator raft snapshot save "/backup/${SNAP_NAME}"
                  
                  echo "[+] Computing SHA256 checksum..."
                  cd /backup
                  sha256sum "${SNAP_NAME}" > "${SNAP_NAME}.sha256"
                  
                  echo "[✓] Raft snapshot created successfully:"
                  ls -lh "/backup/${SNAP_NAME}"*
              volumeMounts:
                - name: backup-scratch
                  mountPath: /backup
          containers:
            - name: rclone-gdrive-sync
              image: rclone/rclone:1.68.2
              imagePullPolicy: IfNotPresent
              securityContext:
                runAsUser: 1000
                runAsGroup: 1000
              command:
                - /bin/sh
                - /scripts/sync-gdrive.sh
              volumeMounts:
                - name: backup-scratch
                  mountPath: /backup
                - name: backup-scripts
                  mountPath: /scripts
                - name: gdrive-secret
                  mountPath: /etc/gdrive
                  readOnly: true
          volumes:
            - name: backup-scratch
              emptyDir: {}
            - name: backup-scripts
              configMap:
                name: vault-backup-scripts
                defaultMode: 0755
            - name: gdrive-secret
              secret:
                secretName: vault-gdrive-backup-secret
                optional: false
