apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: litellm
data:
  config.yaml: |
    model_list:
      # Primary Model Route: Nemotron Super 49B v1.5
      - model_name: nemotron-super-49b-v1.5
        litellm_params:
          model: hosted_vllm/nvidia/llama-3.3-nemotron-super-49b-v1.5
          api_base: http://nemotron-49b.nim-system.svc.cluster.local:8000/v1
          api_key: "local-nim-key"
          temperature: 0.6
          max_tokens: 8192

      # Fully qualified NGC model name alias
      - model_name: nvidia/llama-3.3-nemotron-super-49b-v1.5
        litellm_params:
          model: hosted_vllm/nvidia/llama-3.3-nemotron-super-49b-v1.5
          api_base: http://nemotron-49b.nim-system.svc.cluster.local:8000/v1
          api_key: "local-nim-key"
          temperature: 0.6
          max_tokens: 8192

    litellm_settings:
      drop_params: true
      telemetry: false
      callbacks: ["prometheus"]
      require_auth_for_metrics_endpoint: false
      allow_unauthenticated_metrics: true

    general_settings:
      master_key: "os.environ/LITELLM_MASTER_KEY"
      background_health_checks: true
      allow_unauthenticated_metrics: true

    router_settings:
      routing_strategy: simple-shuffle
      num_retries: 2
      timeout: 120
