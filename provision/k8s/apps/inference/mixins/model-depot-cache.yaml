apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-base
spec:
  template:
    spec:
      initContainers:
        - name: cache-flusher
          image: docker.io/library/busybox:1.36
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          command:
            - /bin/sh
            - -c
            - |
              echo "==> Flushing Linux kernel page cache after hydration..."
              sync
              echo 3 > /proc/sys/vm/drop_caches || true
              echo "==> Page cache flush complete."
          volumeMounts:
            - name: proc
              mountPath: /proc
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "1"
              memory: "256Mi"
      volumes:
        - name: local-ready-cache
          hostPath:
            path: /workspace/models/fast-cache
            type: DirectoryOrCreate
        - name: model-depot-storage
          hostPath:
            path: /mnt/model-depot
            type: DirectoryOrCreate
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
        - name: proc
          hostPath:
            path: /proc

