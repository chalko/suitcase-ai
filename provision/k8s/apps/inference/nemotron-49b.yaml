apiVersion: v1
kind: ConfigMap
metadata:
  name: nemotron-49b-config
  namespace: nim-system
  labels:
    app.kubernetes.io/name: nemotron-49b
    app.kubernetes.io/component: llm-inference
data:
  NIM_MODEL_NAME: "nvidia/llama-3.3-nemotron-super-49b-v1.5"
  NIM_MODEL_PROFILE: "498e09394f7016bb2f08d830e3da8ad03dcf7b027a227d57f397cc69682f05c8"
  MODEL_DIR: "models--nim--nvidia--llama-3.3-nemotron-super-49b-v1.5"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nemotron-49b-haze
  namespace: nim-system
  labels:
    app.kubernetes.io/name: nemotron-49b
    app.kubernetes.io/component: llm-inference
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nemotron-49b
  template:
    metadata:
      labels:
        app: nemotron-49b
    spec:
      initContainers:
        # Phase 1A: Target model cache directory
        - name: depot-hydration-preflight
          envFrom:
            - configMapRef:
                name: nemotron-49b-config
        # Phase 1B: Model profile download & validation
        - name: download-model
          image: nim-model-image
          args: ["--use-cache", "--profiles", "$(NIM_MODEL_PROFILE)"]
          envFrom:
            - configMapRef:
                name: nemotron-49b-config
      # Phase 2: Runtime Inference Engine
      containers:
        - name: nemotron-engine
          image: nim-model-image
          envFrom:
            - configMapRef:
                name: nemotron-49b-config
          env:
            - name: NIM_GPU_MEMORY_UTILIZATION
              value: "0.75"
            - name: NIM_PASSTHROUGH_ARGS
              value: "--enable-prefix-caching --kv-cache-dtype fp8 --enable-auto-tool-choice --tool-call-parser llama3_json"
            - name: NIM_MAX_NUM_SEQS
              value: "64"
            - name: NIM_MAX_MODEL_LEN
              value: "32768"
          resources:
            requests:
              cpu: "8"
              memory: "32Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "20"
              memory: "110Gi"
              nvidia.com/gpu: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: nemotron-49b
  namespace: nim-system
  labels:
    app.kubernetes.io/name: nemotron-49b
    app.kubernetes.io/component: llm-inference
spec:
  type: ClusterIP
  selector:
    app: nemotron-49b
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
    - name: health
      port: 8002
      targetPort: 8002
      protocol: TCP
