apiVersion: apps/v1
kind: Deployment
metadata:
  name: nemotron-49b-haze
  namespace: nim-system
  labels:
    app.kubernetes.io/name: nemotron-49b
    app.kubernetes.io/component: llm-inference
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nemotron-49b
  template:
    metadata:
      labels:
        app: nemotron-49b
    spec:
      initContainers:
        # Phase 1A: Target model cache directory
        - name: depot-hydration-preflight
          env:
            - name: MODEL_DIR
              value: "models--nim--nvidia--llama-3.3-nemotron-super-49b-v1.5"
        # Phase 1B: Model profile download & validation
        - name: download-model
          image: nvcr.io/nim/nvidia/llama-3.3-nemotron-super-49b-v1.5:latest
          args: ["--use-cache", "--profiles", "498e09394f7016bb2f08d830e3da8ad03dcf7b027a227d57f397cc69682f05c8"]
          env:
            - name: NIM_MODEL_NAME
              value: "nvidia/llama-3.3-nemotron-super-49b-v1.5"
      # Phase 2: Runtime Inference Engine
      containers:
        - name: nemotron-engine
          image: nvcr.io/nim/nvidia/llama-3.3-nemotron-super-49b-v1.5:latest
          env:
            - name: NIM_MODEL_NAME
              value: "nvidia/llama-3.3-nemotron-super-49b-v1.5"
            - name: NIM_MODEL_PROFILE
              value: "498e09394f7016bb2f08d830e3da8ad03dcf7b027a227d57f397cc69682f05c8"
            - name: NIM_GPU_MEMORY_UTILIZATION
              value: "0.75"
            - name: NIM_PASSTHROUGH_ARGS
              value: "--enable-prefix-caching --kv-cache-dtype fp8 --enable-auto-tool-choice --tool-call-parser llama3_json"
            - name: NIM_MAX_NUM_SEQS
              value: "64"
            - name: NIM_MAX_MODEL_LEN
              value: "32768"
          resources:
            requests:
              cpu: "8"
              memory: "32Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "20"
              memory: "110Gi"
              nvidia.com/gpu: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: nemotron-49b
  namespace: nim-system
  labels:
    app.kubernetes.io/name: nemotron-49b
    app.kubernetes.io/component: llm-inference
spec:
  type: ClusterIP
  selector:
    app: nemotron-49b
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
    - name: health
      port: 8002
      targetPort: 8002
      protocol: TCP
