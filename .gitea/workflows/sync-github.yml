name: Sync Public Branch to GitHub

on:
  push:
    branches:
      - public

jobs:
  sync-to-github:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Public Branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: public

      - name: Run Zero-Plaintext Security Preflight
        run: |
          chmod +x ./scripts/preflight-public-scan.sh
          ./scripts/preflight-public-scan.sh

      - name: Push to GitHub Main
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "❌ ERROR: GH_TOKEN secret is not set in Gitea."
            exit 1
          fi
          git remote add github "https://x-access-token:${GH_TOKEN}@github.com/chalko/suitcase-ai.git" || true
          git push -u github public:main --tags
