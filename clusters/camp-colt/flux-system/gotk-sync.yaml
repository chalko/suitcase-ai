# This manifest was generated for Camp Colt Flux GitOps.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1m0s
  ref:
    branch: main
  url: http://gitea.gitea.svc.cluster.local:3000/colt/suitcase-ai.git
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./clusters/camp-colt/flux-system
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: camp-colt-infra
  namespace: flux-system
spec:
  dependsOn:
    - name: flux-system
  interval: 5m0s
  path: ./provision/k8s
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
